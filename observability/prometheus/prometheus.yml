global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert-rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'inference-service'
    static_configs:
      - targets: ['inference-service:8001']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8000']

  - job_name: 'result-service'
    static_configs:
      - targets: ['result-service:8002']

  - job_name: 'incident-service'
    static_configs:
      - targets: ['incident-service:8003']

  - job_name: 'remediation-service'
    static_configs:
      - targets: ['remediation-service:8004']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8005']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
