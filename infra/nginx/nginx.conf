# Single public entry point for the whole platform. Everything else
# (auth-service, inference-service, result-service, incident-service,
# remediation-service, notification-service, postgres, redis, prometheus,
# loki, grafana) stays on the internal Docker network only -- see
# docker-compose.prod.yml, which removes their host port publishes.
#
# TLS termination: this file listens on plain :80. For real HTTPS, either
# put this behind a managed load balancer that terminates TLS, or add a
# `listen 443 ssl;` server block here with your own cert/key mounted in
# (e.g. via certbot) -- deliberately left out since it depends on a real
# domain this repo doesn't have.

server {
    listen 80;
    server_name _;

    # React app (static build output)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Everything the frontend calls goes to the gateway -- see
    # src/frontend/src/api.js's API_URL. Set VITE_API_URL to this proxy's
    # own origin (e.g. https://aiops.yourdomain.com) when building the
    # frontend for this topology, since the gateway itself is no longer
    # directly reachable from outside.
    location /gateway/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket needs the Upgrade/Connection headers explicitly --
    # standard proxy_pass alone doesn't forward those.
    location /gateway/ws/ {
        proxy_pass http://api-gateway:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
