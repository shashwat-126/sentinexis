# ConfigMap holds non-sensitive, environment-shaped config -- the K8s
# equivalent of .env, using in-cluster DNS names (http://<service>:<port>,
# resolved via Kubernetes' built-in Service DNS) instead of the
# docker-compose service names. Both happen to be identical here because
# Kubernetes Service names and Compose service names were kept the same on
# purpose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  AUTH_SERVICE_URL: "http://auth-service:8000"
  INFERENCE_SERVICE_URL: "http://inference-service:8001"
  RESULT_SERVICE_URL: "http://result-service:8002"
  INCIDENT_SERVICE_URL: "http://incident-service:8003"
  REMEDIATION_SERVICE_URL: "http://remediation-service:8004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8005"
  INCIDENT_SERVICE_WS_URL: "ws://incident-service:8003/ws/incidents"
  PROMETHEUS_URL: "http://prometheus:9090"
  FIREBASE_PROJECT_ID: "sentinexis"
  MONITORED_SERVICES: "api-gateway,auth-service,inference-service,result-service,incident-service"
  VERIFICATION_WAIT_SECONDS: "10"
  VERIFICATION_MAX_RETRIES: "3"
  VERIFICATION_RETRY_INTERVAL_SECONDS: "5"
  RCA_CPU_THRESHOLD: "90"
  RCA_MEMORY_THRESHOLD: "95"
  RCA_LATENCY_THRESHOLD_MS: "3000"
  RCA_ERROR_RATE_THRESHOLD: "15"
  # Off by default even in the cluster -- flip explicitly once you've
  # verified the RBAC in rbac.yaml grants exactly what you expect. See
  # docs/how-to-run.md's Kubernetes section.
  ENABLE_KUBERNETES_REMEDIATION: "false"
  ENABLE_DB_CHAOS: "false"
---
# Secret holds values that are actually sensitive. The placeholders below
# MUST be replaced before any real deployment -- this file is safe to commit
# (no real secrets in it) precisely because nothing in it is real.
# Generate real values with, e.g.:
#   kubectl create secret generic platform-secrets \
#     --from-literal=DATABASE_URL=postgresql://user:CHANGE_ME@postgres:5432/aiops \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=INTERNAL_API_KEY=$(openssl rand -hex 32) \
#     --dry-run=client -o yaml > secret.local.yaml
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:CHANGE_ME_BEFORE_DEPLOYING@postgres:5432/aiops"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "CHANGE_ME_BEFORE_DEPLOYING"
  INTERNAL_API_KEY: "CHANGE_ME_BEFORE_DEPLOYING"
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "CHANGE_ME_BEFORE_DEPLOYING"
  POSTGRES_DB: "aiops"
