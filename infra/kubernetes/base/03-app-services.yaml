# Every backend service follows the same shape: envFrom the shared
# ConfigMap/Secret (03-app-services rides on top of what 00-configmap-secret
# already defines -- one source of truth, not copy-pasted env blocks),
# liveness/readiness against the same /health endpoint the Docker Compose
# healthchecks already use, and requests/limits sized for a small
# kind/minikube node (this is a research testbed, not a production fleet).
#
# Images are built locally and loaded into the cluster -- see
# docs/how-to-run.md's Kubernetes section for the exact
# `docker build` + `kind load docker-image` sequence. imagePullPolicy is
# IfNotPresent everywhere so a local image is used as-is instead of the
# kubelet trying (and failing) to pull it from a registry.

# ---------------------------------------------------------------------
# auth-service
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: aiops-platform-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: "50m", memory: "64Mi" }, limits: { cpu: "250m", memory: "256Mi" } }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service }
spec:
  selector: { app: auth-service }
  ports: [{ port: 8000, targetPort: 8000 }]

