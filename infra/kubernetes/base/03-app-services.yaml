# ---------------------------------------------------------------------
# remediation-service -- the only workload that gets the RBAC-scoped
# service account from 01-rbac.yaml. No Docker socket mount here (unlike
# docker-compose) -- in-cluster, it authenticates to the Kubernetes API
# via its service account token instead, which k8s_executor.py already
# picks up automatically through load_incluster_config().
# ---------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-service
spec:
  replicas: 1
  selector: { matchLabels: { app: remediation-service } }
  template:
    metadata: { labels: { app: remediation-service } }
    spec:
      serviceAccountName: remediation-service
      containers:
        - name: remediation-service
          image: aiops-platform-remediation-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8004 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          readinessProbe: { httpGet: { path: /health, port: 8004 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8004 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: "50m", memory: "64Mi" }, limits: { cpu: "250m", memory: "256Mi" } }
---
apiVersion: v1
kind: Service
metadata: { name: remediation-service }
spec:
  selector: { app: remediation-service }
  ports: [{ port: 8004, targetPort: 8004 }]

