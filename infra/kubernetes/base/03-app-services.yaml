# ---------------------------------------------------------------------
# aiops-engine -- background orchestrator, no inbound traffic, so no
# Service/probe: it doesn't run an HTTP server, it's a polling loop that
# calls out to Prometheus/incident-service/remediation-service.
# ---------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-engine
spec:
  replicas: 1 # singleton by design -- two copies would double-fire remediation for the same incident
  strategy: { type: Recreate } # never run two copies mid-rollout, for the same reason
  selector: { matchLabels: { app: aiops-engine } }
  template:
    metadata: { labels: { app: aiops-engine } }
    spec:
      containers:
        - name: aiops-engine
          image: aiops-platform-aiops-engine:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }

