# ---------------------------------------------------------------------
# edge -- the production frontend build (infra/nginx/Dockerfile: Vite
# built for real, served + reverse-proxied by nginx), NOT the dev-server
# image docker-compose.yml uses. This is the only thing meant to be
# reachable from outside the cluster -- see docs/how-to-run.md for
# `kubectl port-forward svc/edge` (local/reproducible) vs. an Ingress
# (real domain + TLS, optional, not required to run the experiments).
# ---------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 1
  selector: { matchLabels: { app: edge } }
  template:
    metadata: { labels: { app: edge } }
    spec:
      containers:
        - name: edge
          image: aiops-platform-edge:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3, periodSeconds: 10 }
          resources: { requests: { cpu: "20m", memory: "32Mi" }, limits: { cpu: "100m", memory: "128Mi" } }
---
apiVersion: v1
kind: Service
metadata: { name: edge }
spec:
  type: ClusterIP
  selector: { app: edge }
  ports: [{ port: 80, targetPort: 80 }]
